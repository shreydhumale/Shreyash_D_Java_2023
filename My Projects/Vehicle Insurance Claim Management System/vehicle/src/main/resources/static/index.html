<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Vehicle Insurance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(to right, #007bff, #0056b3);
            color: white;
            text-align: center;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 500px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            font-size: 18px;
            color: white;
            background: #007bff;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s ease-in-out;
            box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            background: #0056b3;
            transform: scale(1.05);
        }
        .btn-secondary {
            background: #28a745;
        }
        .btn-secondary:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Welcome to the Vehicle Insurance System</h1>
        <p>Submit and track your insurance claims with ease.</p>

        <a href="login.html" class="btn">Login</a>
        <a href="register.html" class="btn btn-secondary">Register</a>
    </div>

    <script>
        // ✅ Redirect to Dashboard if already logged in
        if (localStorage.getItem("username")) {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
