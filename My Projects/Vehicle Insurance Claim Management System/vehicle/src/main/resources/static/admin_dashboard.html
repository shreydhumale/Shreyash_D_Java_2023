<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin - View All Claims</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			text-align: center;
			margin: 50px;
		}

		table {
			width: 90%;
			margin: auto;
			border-collapse: collapse;
		}

		th,
		td {
			padding: 10px;
			border: 1px solid #ddd;
			text-align: center;
		}

		button {
			padding: 5px 10px;
			cursor: pointer;
			margin: 5px;
			border: none;
			border-radius: 5px;
		}

		.approve {
			background-color: green;
			color: white;
		}

		.reject {
			background-color: red;
			color: white;
		}

		.logout-btn {
			background-color: red;
			color: white;
			border: none;
			padding: 10px 20px;
			border-radius: 5px;
			cursor: pointer;
		}
	</style>
</head>

<body>

	<h2>Admin - View All Claims</h2>
	<button class="logout-btn" onclick="logout()">Logout</button>

	<h3>All Claims</h3>
	<table>
		<thead>
			<tr>
				<th>ID</th>
				<th>User</th>
				<th>Vehicle Info</th>
				<th>Description</th>
				<th>Status</th>
				<th>Action</th>
			</tr>
		</thead>
		<tbody id="claimsTable">
			<!-- Claims will be populated here -->
		</tbody>
	</table>

	<script>

		// ✅ Get role from localStorage
		const role = localStorage.getItem("role");
		if (role !== "ADMIN") {
		    alert("Access Denied! Redirecting to Dashboard.");
		    window.location.href = "dashboard.html";
		}

		function loadAllClaims() {
		    fetch("http://localhost:8081/api/claims/all")
		        .then(response => response.json())
		        .then(data => {
		            const tableBody = document.getElementById("claimsTable");
		            tableBody.innerHTML = "";

		            data.forEach(claim => {
		                const row = document.createElement("tr");
		                row.innerHTML = `
		                    <td>${claim.id}</td>
		                    <td>${claim.user ? claim.user.username : "Unknown"}</td>
		                    <td>${claim.vehicleInfo}</td>
		                    <td>${claim.accidentDescription}</td>
		                    <td>${claim.claimStatus}</td>
		                    <td>
		                        ${claim.claimStatus === 'PENDING' ? `
		                            <button onclick="updateClaimStatus(${claim.id}, 'APPROVED')">Approve</button>
		                            <button onclick="updateClaimStatus(${claim.id}, 'REJECTED')">Reject</button>
		                        ` : 'No Action'}
		                    </td>
		                `;
		                tableBody.appendChild(row);
		            });
		        })
		        .catch(error => console.error("Error loading claims:", error));
		}

		// ✅ Load claims on page load
		loadAllClaims();

		function updateClaimStatus(claimId, status) {
			fetch(`http://localhost:8081/api/claims/${claimId}/update-status?status=${status}`, {
				method: "PUT",
				headers: {"Content-Type": "application/json"}
			})
				.then(response => response.text())
				.then(data => {
					alert(data);
					loadAllClaims();
				})
				.catch(error => console.error("Error updating claim status:", error));
		}

		// ✅ Logout function
		function logout() {
			localStorage.removeItem("username"); // ✅ Clear stored username
			alert("You have been logged out!");
			window.location.href = "login.html"; // ✅ Redirect to login
		}

		// ✅ Load all claims when the page loads
		loadAllClaims();
	</script>
</body>

</html>
