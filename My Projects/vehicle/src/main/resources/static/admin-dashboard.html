<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; background: #f4f4f4; }
        .container { max-width: 800px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1); }
        h2 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; }
        th { background: #007bff; color: white; }
        button { padding: 8px 12px; cursor: pointer; }
        .approve { background: green; color: white; border: none; }
        .reject { background: red; color: white; border: none; }
        .delete { background: gray; color: white; border: none; }
        .logout-btn { background: red; padding: 10px 20px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admin Dashboard</h2>
        <h3>Manage Insurance Claims</h3>
        <table>
            <thead>
                <tr>
                    <th>Claim ID</th>
                    <th>User</th>
                    <th>Vehicle Info</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="claimsTable"></tbody>
        </table>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <script>
        const adminRole = localStorage.getItem("role");
        if (adminRole !== "ADMIN") {
            alert("Access denied! Only admins can view this page.");
            window.location.href = "login.html";
        }

    
		function loadAllClaims() {
		    fetch("http://localhost:8081/api/admin/claims")
		    .then(response => {
		        if (!response.ok) {
		            throw new Error("Server error: " + response.status);
		        }
		        return response.text();  
		    })
		    .then(text => {
		        if (!text) {
		            return [];  
		        }
		        return JSON.parse(text);  
		    })
		    .then(claims => {
		        console.log("Claims data:", claims);
		        const table = document.getElementById("claimsTable");
		        table.innerHTML = ""; 

		        if (claims.length === 0) {
		            table.innerHTML = `<tr><td colspan="6">No claims found</td></tr>`;
		        } else {
		            claims.forEach(claim => {
		                let row = `<tr>
		                    <td>${claim.id}</td>
		                    <td>${claim.user ? claim.user.username : "Unknown"}</td>
		                    <td>${claim.vehicleInfo}</td>
		                    <td>${claim.accidentDescription}</td>
		                    <td>${claim.claimStatus}</td>
		                    <td>
		                        <button class="approve" onclick="updateClaimStatus(${claim.id}, 'APPROVED')">Approve</button>
		                        <button class="reject" onclick="updateClaimStatus(${claim.id}, 'REJECTED')">Reject</button>
		                        <button class="delete" onclick="deleteClaim(${claim.id})">Delete</button>
		                    </td>
		                </tr>`;
		                table.innerHTML += row;
		            });
		        }
		    })
		    .catch(error => {
		        console.error("Error loading claims:", error);
		        alert("Failed to load claims.");
		    });
		}

        function updateClaimStatus(claimId, status) {
            fetch(`http://localhost:8081/api/admin/claims/${claimId}/status`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ claimStatus: status })
            })
            .then(() => {
                alert("Claim status updated!");
                loadAllClaims();
            })
            .catch(error => console.error("Error updating claim:", error));
        }

        function deleteClaim(claimId) {
            if (!confirm("Are you sure you want to delete this claim?")) return;
            fetch(`http://localhost:8081/api/admin/claims/${claimId}`, {
                method: "DELETE"
            })
            .then(() => {
                alert("Claim deleted!");
                loadAllClaims();
            })
            .catch(error => console.error("Error deleting claim:", error));
        }

        function logout() {
            localStorage.clear();
            alert("Logged out!");
            window.location.href = "login.html";
        }

        loadAllClaims();
    </script>

</body>
</html>
