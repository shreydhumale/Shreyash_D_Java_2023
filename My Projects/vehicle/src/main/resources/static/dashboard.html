<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            color: white;
        }
        .logout-btn {
            background-color: red;
        }
        .approve-btn {
            background-color: green;
        }
        .reject-btn {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to the Dashboard</h2>
        <p>Logged in as: <strong id="usernameDisplay"></strong> (<span id="roleDisplay"></span>)</p>

        <!-- Claim Submission Form -->
        <div id="claimFormContainer" style="display: none;">
            <h3>Submit a New Claim</h3>
            <form id="claimForm">
                <input type="text" id="vehicleInfo" placeholder="Vehicle Info" required>
                <textarea id="accidentDescription" placeholder="Accident Description" required></textarea>
                <button type="submit">Submit Claim</button>
            </form>
        </div>

        <div id="claimsContainer"></div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <script>
        console.log("Stored Username:", localStorage.getItem("username"));
        console.log("Stored Role:", localStorage.getItem("role"));

        const username = localStorage.getItem("username");
        const role = localStorage.getItem("role");

        if (!username || !role) {
            alert("You must log in first!");
            localStorage.clear();
            window.location.href = "login.html";
        } else {
            document.getElementById("usernameDisplay").innerText = username;
            document.getElementById("roleDisplay").innerText = role;

            if (role === "OWNER") {
                document.getElementById("claimFormContainer").style.display = "block";
            }
        }

        fetch(`http://localhost:8081/api/claims/${username}`)
            .then(response => response.json())
            .then(data => {
                console.log("Claims received:", data);
                if (data.length === 0) {
                    document.getElementById("claimsContainer").innerHTML = "<p>No claims found.</p>";
                } else {
                    displayClaims(data);
                }
            })
            .catch(error => {
                console.error("Error fetching claims:", error);
                document.getElementById("claimsContainer").innerHTML = "<p>Error loading claims.</p>";
            });

        function displayClaims(claims) {
            const container = document.getElementById("claimsContainer");
            container.innerHTML = "<h3>Your Claims</h3>";

            claims.forEach(claim => {
                let claimDiv = document.createElement("div");
                claimDiv.innerHTML = `<p><strong>Vehicle:</strong> ${claim.vehicleInfo}</p>
                                      <p><strong>Accident:</strong> ${claim.accidentDescription}</p>
                                      <p><strong>Status:</strong> ${claim.claimStatus}</p>`;

                if (role === "ADMIN" || role === "ADJUSTER") {
                    claimDiv.innerHTML += `<button class="approve-btn" onclick="updateClaimStatus(${claim.id}, 'APPROVED')">Approve</button>
                                           <button class="reject-btn" onclick="updateClaimStatus(${claim.id}, 'REJECTED')">Reject</button>`;
                }

                claimDiv.innerHTML += `<hr>`;
                container.appendChild(claimDiv);
            });
        }

        document.getElementById("claimForm")?.addEventListener("submit", function (e) {
            e.preventDefault();

            const claimData = {
                vehicleInfo: document.getElementById("vehicleInfo").value,
                accidentDescription: document.getElementById("accidentDescription").value,
                user: { username: username } 
            };

            fetch("http://localhost:8081/api/claims/submit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(claimData),
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                window.location.reload();
            })
            .catch(error => {
                console.error("Error submitting claim:", error);
                alert("Failed to submit claim. Check console for details.");
            });
        });

		    function updateClaimStatus(claimId, status) {
		        const username = localStorage.getItem("username");

		        fetch(`http://localhost:8081/api/claims/${claimId}/update-status?status=${status}&username=${username}`, {
		            method: "PATCH",
		            headers: { "Content-Type": "application/json" },
		        })
		        .then(response => {
		            if (!response.ok) {
		                throw new Error("Failed to update claim");
		            }
		            return response.text();
		        })
		        .then(data => {
		            alert(data); 
		            window.location.reload(); 
		        })
		        .catch(error => {
		            console.error("Error updating claim status:", error);
		            alert("Failed to update claim status.");
		        });
		    }

        function logout() {
            localStorage.removeItem("username"); 
            localStorage.removeItem("role"); 
            alert("You have been logged out!");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
