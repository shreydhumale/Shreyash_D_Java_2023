<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Vehicle Insurance System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            font-size: 18px;
            color: white;
            background: #007bff;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-secondary {
            background: #28a745;
        }
        .btn-secondary:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Vehicle Insurance System</h1>
        <p>Manage your insurance claims easily and efficiently.</p>

        <a href="login.html" class="btn">Login</a>
        <a href="register.html" class="btn btn-secondary">Register</a>
    </div>

    <script>
        if (localStorage.getItem("username")) {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
